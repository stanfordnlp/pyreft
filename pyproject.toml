[project]
name = "pyreft"
version = "0.1.0"
description = "REFT: Representation Finetuning for Language Models"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "Zhengxuan Wu", email = "wuzhengx@stanford.edu"},
]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.21.0",
    "pyvene>=0.1.7",
    "transformers>=4.48.2",
    "protobuf>=3.20.0",
    "matplotlib",
    "ipywidgets>=8.1.1",
    "plotnine>=0.12.4",
    "huggingface-hub",
    "numpy>=1.26.4",
    "accelerate>=0.29.1",
    "sentencepiece>=0.1.96",
    "evaluate>=0.4.1",
    "datasets>=2.18.0",
    "wandb",
    "scikit-learn",
    "tqdm",
    "peft>=0.10.0",
]

[project.optional-dependencies]
flash = [
    "flash-attn>=2.5.6",
]
notebook = [
    "jupyter",
    "fsspec>=2024.2.0",
    "ydata-profiling>=4.7.0",
    "seaborn==0.12.2",
    "gcsfs>=2024.2.0",
]
dev = [
    "pytest",
    "black",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/stanfordnlp/pyreft"
Repository = "https://github.com/stanfordnlp/pyreft"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyreft"]

[tool.uv]
dev-dependencies = [
    "pytest",
    "black",
    "ruff",
]
no-build-isolation-package = ["flash-attn"]

[tool.ruff]
line-length = 120
target-version = "py38"

[tool.black]
line-length = 120
target-version = ["py38", "py39", "py310", "py311", "py312"]

